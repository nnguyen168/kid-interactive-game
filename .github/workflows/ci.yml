name: CI

# Checks every push and pull request. Deployments are handled by Vercel's
# GitHub integration (production from `main`, previews for other branches).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next build` also type-checks the project.
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
